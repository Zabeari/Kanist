<span class="task-meta-date-field__icon" aria-hidden="true">
  @if (icon() === 'calendar') {
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" />
      <path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  } @else {
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
    </svg>
  }
</span>

<span class="task-meta-date-field__label">{{ label() }}</span>

<div class="task-meta-date-field__control">
  <button
    type="button"
    class="task-meta-date-field__trigger"
    [id]="inputId()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-expanded]="pickerOpen()"
    aria-haspopup="dialog"
    [disabled]="disabled()"
    (click)="togglePicker($event)"
  >
    @if (value()) {
      <span class="task-meta-date-field__value">{{ displayValue() }}</span>
    } @else {
      <span class="task-meta-date-field__placeholder">Not set</span>
    }
  </button>

  @if (pickerOpen()) {
    <div
      class="task-meta-date-field__popover"
      appClickOutside
      role="dialog"
      [attr.aria-label]="ariaLabel()"
      (clickOutside)="closePicker()"
    >
      <div class="task-meta-date-field__calendar">
        <div class="task-meta-date-field__calendar-header">
          <button
            type="button"
            class="task-meta-date-field__nav"
            aria-label="Previous month"
            (click)="previousMonth($event)"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <span class="task-meta-date-field__calendar-title">{{ calendarTitle() }}</span>
          <button
            type="button"
            class="task-meta-date-field__nav"
            aria-label="Next month"
            (click)="nextMonth($event)"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <div class="task-meta-date-field__weekdays" aria-hidden="true">
          @for (weekday of weekdayLabels; track weekday) {
            <span class="task-meta-date-field__weekday">{{ weekday }}</span>
          }
        </div>

        <div class="task-meta-date-field__grid" role="grid">
          @for (day of calendarDays(); track day.dateValue) {
            <button
              type="button"
              role="gridcell"
              class="task-meta-date-field__day"
              [class.task-meta-date-field__day--outside]="!day.inCurrentMonth"
              [class.task-meta-date-field__day--disabled]="day.isDisabled"
              [class.task-meta-date-field__day--selected]="day.isSelected"
              [class.task-meta-date-field__day--today]="day.isToday"
              [disabled]="day.isDisabled"
              [attr.data-date]="day.dateValue"
              [attr.aria-label]="day.dateValue"
              [attr.aria-selected]="day.isSelected"
              [attr.aria-disabled]="day.isDisabled"
              (click)="selectDay(day, $event)"
            >
              {{ day.day }}
            </button>
          }
        </div>
      </div>
    </div>
  }
</div>

@if (value()) {
  <button
    type="button"
    class="task-meta-date-field__remove"
    [attr.aria-label]="removeAriaLabel()"
    (click)="clear($event)"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
}

@if (showError() && errorMessage()) {
  <span class="task-meta-date-field__error">{{ errorMessage() }}</span>
}
